name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  test-and-audit:
    name: Unit Tests & Quality Audits
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: molan-home

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Run Unit & Integration Tests
        run: npm test

      - name: Run Golden Suite Audit
        run: npm run audit:golden

      - name: Run Feature Contract Audit
        run: npm run audit:features
