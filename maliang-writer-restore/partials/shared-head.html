<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{PAGE_TITLE}}</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>

<!-- Brand Tokens -->
<link rel="stylesheet" href="../colors_and_type.css">

<!-- Base Reset -->
<style>
    /* 基础盒模型重置 */
    *, *::before, *::after {
        box-sizing: border-box;
    }

    /* 去除默认边距与内边距 */
    html, body, h1, h2, h3, h4, h5, h6, p, ul, ol, li, figure, figcaption, blockquote, dl, dd {
        margin: 0;
        padding: 0;
    }

    /* 设置全站字体族与抗锯齿 */
    body {
        font-family: 'Noto Serif SC', 'ZCOOL XiaoWei', 'Ma Shan Zheng', serif;
        color: #0a0a0a;
        background-color: #ffffff;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    /* 列表无默认样式 */
    ul, ol {
        list-style: none;
    }

    /* 链接继承颜色与去除下划线 */
    a {
        color: inherit;
        text-decoration: none;
    }

    /* 图片与媒体元素自适应 */
    img, picture, video, canvas, svg {
        display: block;
        max-width: 100%;
    }

    /* 按钮与输入框继承字体 */
    button, input, textarea, select {
        font: inherit;
    }

    /* 去除按钮默认边框与背景 */
    button {
        border: none;
        background: none;
        cursor: pointer;
    }
</style>
