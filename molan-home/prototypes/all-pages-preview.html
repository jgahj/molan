<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>墨阑 · 全功能页面预览</title>
  <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --ink: #0a0a0a;
      --ink-soft: #292927;
      --paper: #fff;
      --paper-warm: #fbfbf9;
      --canvas: #f3f3f0;
      --line: #e7e7e2;
      --line-strong: #d6d6d0;
      --muted: #74746e;
      --muted-light: #a5a59f;
      --green: #25845a;
      --green-bg: #eef8f1;
      --blue: #385c91;
      --blue-bg: #eef3fb;
      --amber: #a86b20;
      --amber-bg: #fff7ea;
      --danger: #ae3d3d;
      --danger-bg: #fff0f0;
      --shadow: 0 10px 30px rgba(17, 17, 15, .06);
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
      --mono: "SFMono-Regular", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; color: var(--ink); background: var(--canvas); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    a { color: inherit; }
    .icon { width: 16px; height: 16px; stroke-width: 1.8; flex: none; }
    .site-header { height: 64px; display: flex; align-items: center; gap: 28px; padding: 0 28px; background: rgba(255,255,255,.96); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 30; }
    .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; min-width: 212px; }
    .brand-mark { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; background: var(--ink); color: #fff; font-family: var(--serif); font-size: 17px; font-weight: 700; }
    .brand-name { font-family: var(--serif); font-weight: 700; font-size: 17px; letter-spacing: .02em; }
    .brand-label { color: var(--muted); border-left: 1px solid var(--line-strong); padding-left: 10px; font-size: 12px; }
    .top-crumb { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--muted); font-size: 12px; }
    .top-crumb strong { color: var(--ink); font-weight: 600; }
    .top-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .top-button, .avatar-button { height: 31px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--muted); padding: 0 9px; font-size: 12px; }
    .top-button:hover, .avatar-button:hover { color: var(--ink); background: var(--canvas); }
    .avatar-button { width: 31px; padding: 0; border-color: var(--line-strong); border-radius: 50%; }
    .preview-frame { min-height: calc(100vh - 64px); display: grid; grid-template-columns: 240px minmax(0, 1fr); }
    .app-sidebar { background: var(--paper); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
    .sidebar-scroll { flex: 1; overflow: auto; padding: 20px 13px 15px; }
    .sidebar-scroll::-webkit-scrollbar, .page-scroll::-webkit-scrollbar, .editor-scroll::-webkit-scrollbar, .chat-scroll::-webkit-scrollbar { width: 8px; }
    .sidebar-scroll::-webkit-scrollbar-thumb, .page-scroll::-webkit-scrollbar-thumb, .editor-scroll::-webkit-scrollbar-thumb, .chat-scroll::-webkit-scrollbar-thumb { background: #d7d7d1; border: 2px solid transparent; background-clip: padding-box; border-radius: 8px; }
    .side-section { margin-bottom: 23px; }
    .side-label { padding: 0 9px 7px; color: var(--muted-light); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .side-link { width: 100%; display: flex; align-items: center; gap: 9px; padding: 9px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); text-align: left; font-size: 13px; }
    .side-link:hover { color: var(--ink); background: var(--canvas); }
    .side-link.active { color: var(--ink); background: #f0f0ed; font-weight: 600; }
    .side-link .link-count { margin-left: auto; color: var(--muted-light); font-size: 11px; font-family: var(--mono); }
    .side-link .admin-dot { width: 6px; height: 6px; margin-left: auto; border-radius: 50%; background: var(--amber); }
    .side-footer { padding: 13px 16px; border-top: 1px solid var(--line); }
    .side-profile { display: flex; align-items: center; gap: 9px; }
    .profile-avatar { width: 29px; height: 29px; border: 1px solid var(--line-strong); border-radius: 50%; flex: none; }
    .profile-copy { min-width: 0; }
    .profile-name { font-size: 12px; font-weight: 600; }
    .profile-meta { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .side-profile .icon-button { margin-left: auto; }
    .icon-button { width: 29px; height: 29px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: transparent; color: var(--muted); }
    .icon-button:hover { color: var(--ink); background: var(--canvas); }
    .page-area { min-width: 0; min-height: 0; position: relative; }
    .preview-frame.standalone-context { grid-template-columns: minmax(0, 1fr); }
    .preview-frame.standalone-context .app-sidebar { display: none; }
    .preview-frame.editor-focus { grid-template-columns: minmax(0, 1fr); }
    .preview-frame.editor-focus .app-sidebar { display: none; }
    body.editor-only-mode { height: 100vh; overflow: hidden; background: var(--canvas); }
    body.editor-only-mode .site-header { display: none; }
    body.editor-only-mode .preview-frame { min-height: 100vh; grid-template-columns: minmax(0, 1fr); }
    body.editor-only-mode .app-sidebar { display: none; }
    body.editor-only-mode .page-area { height: 100vh; }
    body.editor-only-mode .page-scroll { height: 100vh; padding: 0; overflow: hidden; }
    body.editor-only-mode .page-shell.editor-page { width: 100%; height: 100vh; max-width: none; margin: 0; }
    body.editor-only-mode .page-shell.editor-page .page-header { display: none; }
    body.editor-only-mode .editor-rail-toggle { display: inline-flex; top: 12px; left: 244px; }
    .page-scroll { height: calc(100vh - 64px); overflow: auto; padding: 34px clamp(18px, 4vw, 62px) 68px; }
    .page-shell { width: min(1180px, 100%); margin: 0 auto; }
    .page-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 27px; }
    .eyebrow { color: var(--muted); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; }
    .page-title { margin: 7px 0 0; font-family: var(--serif); font-size: clamp(28px, 3.5vw, 43px); line-height: 1.22; letter-spacing: .015em; }
    .page-subtitle { max-width: 600px; margin: 9px 0 0; color: var(--muted); font-size: 13px; line-height: 1.75; }
    .header-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .button { min-height: 35px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--paper); color: var(--ink); font-size: 12px; white-space: nowrap; }
    .button:hover { background: var(--canvas); }
    .button.primary { color: #fff; background: var(--ink); border-color: var(--ink); }
    .button.primary:hover { background: var(--ink-soft); }
    .button.soft { background: var(--paper-warm); }
    .button.danger { color: var(--danger); border-color: #eccaca; background: var(--danger-bg); }
    .button:disabled { opacity: .45; cursor: default; }
    .grid { display: grid; gap: 14px; }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; }
    .panel.pad { padding: 19px; }
    .panel-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .panel-heading h2, .panel-heading h3 { margin: 0; font-size: 14px; line-height: 1.4; }
    .panel-heading p { margin: 4px 0 0; color: var(--muted); font-size: 11px; line-height: 1.55; }
    .panel-body { padding: 18px; }
    .section-title { margin: 0; font-size: 14px; font-weight: 700; }
    .section-note { color: var(--muted); font-size: 12px; line-height: 1.65; }
    .metric { padding: 17px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; }
    .metric-label { color: var(--muted); font-size: 11px; }
    .metric-value { margin-top: 10px; font-size: 25px; font-weight: 700; letter-spacing: -.02em; }
    .metric-foot { display: flex; align-items: center; gap: 5px; margin-top: 7px; color: var(--muted); font-size: 11px; }
    .metric-foot.good { color: var(--green); }
    .metric-foot.warn { color: var(--amber); }
    .badge { display: inline-flex; align-items: center; min-height: 21px; padding: 0 7px; border-radius: 999px; font-size: 10px; white-space: nowrap; }
    .badge.green { color: var(--green); background: var(--green-bg); }
    .badge.blue { color: var(--blue); background: var(--blue-bg); }
    .badge.amber { color: var(--amber); background: var(--amber-bg); }
    .badge.gray { color: var(--muted); background: var(--canvas); }
    .badge.danger { color: var(--danger); background: var(--danger-bg); }
    .divider { height: 1px; background: var(--line); margin: 19px 0; }
    .empty { padding: 42px 20px; text-align: center; color: var(--muted); }
    .empty .empty-icon { width: 39px; height: 39px; display: inline-flex; align-items: center; justify-content: center; border: 1px dashed var(--line-strong); border-radius: 9px; color: var(--muted-light); }
    .empty h3 { margin: 13px 0 5px; color: var(--ink); font-size: 15px; }
    .empty p { margin: 0 auto 16px; max-width: 360px; font-size: 12px; line-height: 1.7; }
    .search-box { min-width: 190px; display: flex; align-items: center; gap: 7px; height: 35px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--paper); color: var(--muted); }
    .search-box input { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 12px; }
    .search-box input::placeholder { color: var(--muted-light); }
    .segmented { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--paper); }
    .segment { min-height: 31px; padding: 0 10px; border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 11px; }
    .segment:last-child { border-right: 0; }
    .segment.active { background: var(--ink); color: #fff; }
    .notice { display: flex; align-items: flex-start; gap: 9px; padding: 12px 13px; border: 1px solid var(--line); border-left: 2px solid var(--ink); border-radius: 6px; background: var(--paper-warm); color: var(--muted); font-size: 12px; line-height: 1.65; }
    .notice strong { color: var(--ink); }
    .toast { position: fixed; right: 25px; bottom: 24px; z-index: 100; transform: translateY(15px); opacity: 0; pointer-events: none; padding: 10px 13px; border-radius: 6px; color: #fff; background: var(--ink); font-size: 12px; transition: opacity .2s ease, transform .2s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .mobile-menu { display: none; }

    /* Overview */
    .overview-hero { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(260px, .65fr); gap: 14px; }
    .continue-panel { min-height: 260px; padding: 25px; color: #fff; background: var(--ink); border-radius: 8px; position: relative; overflow: hidden; }
    .continue-panel::after { content: "墨"; position: absolute; right: 27px; bottom: -39px; color: rgba(255,255,255,.06); font-family: var(--serif); font-size: 190px; line-height: 1; }
    .continue-panel .eyebrow { color: #a8a8a3; }
    .continue-panel h2 { max-width: 520px; margin: 13px 0 8px; font-family: var(--serif); font-size: clamp(24px, 3vw, 34px); line-height: 1.35; position: relative; z-index: 1; }
    .continue-panel p { max-width: 470px; margin: 0; color: #b8b8b2; font-size: 12px; line-height: 1.75; position: relative; z-index: 1; }
    .continue-actions { display: flex; align-items: center; gap: 8px; margin-top: 25px; position: relative; z-index: 1; }
    .continue-actions .button { background: transparent; border-color: #555; color: #fff; }
    .continue-actions .button.primary { background: #fff; color: var(--ink); border-color: #fff; }
    .task-panel { padding: 20px; }
    .task-panel h3 { margin: 0; font-size: 14px; }
    .task-row { display: flex; align-items: center; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .task-row:last-child { border-bottom: 0; padding-bottom: 0; }
    .task-icon { width: 29px; height: 29px; display: inline-flex; align-items: center; justify-content: center; border-radius: 7px; background: var(--canvas); color: var(--muted); flex: none; }
    .task-copy { min-width: 0; flex: 1; }
    .task-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 600; }
    .task-meta { color: var(--muted); font-size: 10px; margin-top: 3px; }
    .recent-table { width: 100%; border-collapse: collapse; }
    .recent-table th { padding: 11px 0; color: var(--muted-light); font-size: 10px; font-weight: 600; text-align: left; border-bottom: 1px solid var(--line); }
    .recent-table td { padding: 13px 0; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); }
    .recent-table tr:last-child td { border-bottom: 0; }
    .recent-table td:first-child { color: var(--ink); font-weight: 600; }
    .quick-action { display: flex; align-items: flex-start; gap: 10px; padding: 15px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); text-align: left; }
    .quick-action:hover { background: var(--paper-warm); border-color: var(--line-strong); }
    .quick-action .icon-wrap { width: 29px; height: 29px; display: inline-flex; align-items: center; justify-content: center; border-radius: 7px; background: var(--canvas); color: var(--ink); }
    .quick-action strong { display: block; font-size: 12px; }
    .quick-action span { display: block; color: var(--muted); font-size: 11px; margin-top: 4px; line-height: 1.5; }

    /* Novels */
    .library-layout { display: grid; grid-template-columns: minmax(0, 1fr) 275px; gap: 14px; }
    .novel-list { display: grid; gap: 9px; }
    .novel-list.grid-view { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .novel-row { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 13px; border-bottom: 1px solid var(--line); }
    .novel-list.grid-view .novel-row { grid-template-columns: 52px minmax(0, 1fr); border: 1px solid var(--line); border-radius: 7px; }
    .novel-list.grid-view .novel-actions { grid-column: 2; justify-content: flex-start; }
    .novel-row:last-child { border-bottom: 0; }
    .novel-cover { width: 58px; aspect-ratio: 3 / 4; display: flex; align-items: flex-end; padding: 8px; color: #fff; background: var(--ink); border-radius: 5px; font-family: var(--serif); font-size: 13px; font-weight: 700; }
    .novel-cover.light { color: var(--ink); background: #e6e3db; }
    .novel-cover.blue { background: #4e6175; }
    .novel-name { font-family: var(--serif); font-size: 15px; font-weight: 700; }
    .novel-desc { max-width: 480px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 4px; color: var(--muted); font-size: 11px; }
    .novel-stats { display: flex; gap: 13px; margin-top: 8px; color: var(--muted-light); font-size: 10px; }
    .novel-actions { display: flex; align-items: center; gap: 6px; }
    .side-summary .summary-number { font-size: 28px; font-weight: 700; }
    .summary-label { color: var(--muted); font-size: 11px; }
    .mini-bar { height: 5px; margin: 15px 0 7px; background: var(--canvas); border-radius: 99px; overflow: hidden; }
    .mini-bar span { display: block; width: 68%; height: 100%; background: var(--ink); }
    .mini-list { display: grid; gap: 11px; margin-top: 17px; }
    .mini-list-row { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 11px; }

    /* Editor */
    .editor-preview { height: 710px; display: grid; grid-template-columns: 185px minmax(0, 1fr) 310px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--canvas); }
    body.editor-only-mode .editor-preview { width: 100%; height: 100vh; min-height: 0; grid-template-columns: 240px minmax(0, 1fr) 386px; border: 0; border-radius: 0; }
    .page-shell.editor-page { width: min(1440px, 100%); position: relative; }
    .page-shell.editor-page .page-header { margin-bottom: 15px; }
    .editor-rail-toggle { position: absolute; top: 106px; left: -50px; z-index: 8; width: 31px; height: 31px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--paper); color: var(--muted); box-shadow: var(--shadow); }
    .editor-rail-toggle:hover { color: var(--ink); background: var(--paper-warm); }
    .editor-nav { background: var(--paper); border-right: 1px solid var(--line); min-width: 0; display: flex; flex-direction: column; }
    .editor-nav-scrim { display: none; }
    .editor-nav-head { padding: 16px 13px; border-bottom: 1px solid var(--line); }
    .editor-nav-title-row { display: flex; align-items: flex-start; gap: 6px; min-width: 0; }
    .editor-nav-head strong { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--serif); font-size: 14px; }
    .editor-nav-head > span { display: block; color: var(--muted); font-size: 10px; margin-top: 4px; }
    .editor-back-button { height: 25px; display: inline-flex; align-items: center; gap: 4px; flex: none; padding: 0 6px; border: 1px solid var(--line-strong); border-radius: 5px; background: var(--paper); color: var(--muted); font-size: 10px; white-space: nowrap; }
    .editor-back-button:hover { color: var(--ink); background: var(--canvas); }
    .editor-back-button .icon { width: 13px; height: 13px; }
    .editor-chapters { flex: 1; overflow: auto; padding: 11px 8px; }
    .editor-chapter { display: flex; align-items: center; gap: 7px; padding: 8px 6px; color: var(--muted); border-radius: 5px; font-size: 11px; cursor: pointer; }
    .editor-chapter.active { color: var(--ink); background: #f1f1ee; font-weight: 600; }
    .editor-chapter small { color: var(--muted-light); font-family: var(--mono); }
    .editor-chapter i { width: 5px; height: 5px; margin-left: auto; border-radius: 50%; background: var(--line-strong); }
    .editor-chapter i.done { background: var(--green); }
    .editor-main { min-width: 0; display: flex; flex-direction: column; }
    .editor-bar { height: 45px; display: flex; align-items: center; justify-content: space-between; padding: 0 13px; background: rgba(243,243,240,.95); border-bottom: 1px solid var(--line); }
    .editor-bar .toolbar { display: flex; align-items: center; gap: 3px; }
    .editor-toolbar-button { width: 27px; height: 27px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 5px; background: transparent; color: var(--muted); }
    .editor-mobile-back { display: none; }
    .editor-toolbar-button:hover { color: var(--ink); background: var(--paper); }
    .editor-scroll { min-height: 0; overflow: auto; padding: 22px; }
    .editor-paper { min-height: 580px; padding: 28px 34px 50px; background: var(--paper); box-shadow: var(--shadow); }
    .editor-paper-meta { display: flex; justify-content: space-between; padding-bottom: 17px; color: var(--muted-light); border-bottom: 1px solid var(--line); font-size: 10px; }
    .editor-paper h2 { margin: 25px 0 8px; font-family: var(--serif); font-size: 27px; }
    .editor-paper p { margin: 0 0 14px; color: #33332f; font-family: var(--serif); font-size: 14px; line-height: 2; }
    .editor-paper .scene-note { padding: 10px 12px; margin: 19px 0; border-left: 2px solid var(--ink); background: var(--paper-warm); color: var(--muted); font-size: 10px; line-height: 1.65; }
    .editor-ai { min-width: 0; background: var(--paper); border-left: 1px solid var(--line); display: flex; flex-direction: column; }
    .ai-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); }
    .ai-name { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; }
    .ai-mark { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; background: var(--ink); color: #fff; }
    .ai-select { margin: 11px 12px 0; width: calc(100% - 24px); height: 30px; padding: 0 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--paper); color: var(--ink); font-size: 10px; }
    .chat-scroll { flex: 1; min-height: 0; overflow: auto; padding: 14px 12px; }
    .chat-message { display: flex; gap: 6px; margin-bottom: 13px; }
    .chat-message.user { flex-direction: row-reverse; }
    .chat-avatar { width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; flex: none; border-radius: 5px; background: var(--ink); color: #fff; font-family: var(--serif); font-size: 9px; }
    .chat-message.user .chat-avatar { background: var(--paper); border: 1px solid var(--line-strong); color: var(--muted); }
    .chat-bubble { max-width: 86%; padding: 8px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper-warm); color: var(--ink-soft); font-size: 10px; line-height: 1.65; }
    .chat-message.user .chat-bubble { color: #fff; background: var(--ink); border-color: var(--ink); }
    .chat-composer { padding: 10px; border-top: 1px solid var(--line); }
    .chat-composer textarea { width: 100%; min-height: 55px; resize: vertical; padding: 8px; border: 1px solid var(--line-strong); border-radius: 6px; outline: 0; font-size: 10px; }
    .chat-send-row { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
    .chat-cost { color: var(--muted); font-size: 9px; }
    .chat-send { width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 5px; background: var(--ink); color: #fff; }
    .chat-send:disabled { opacity: .45; cursor: default; }
    .chat-thinking { display: none; align-items: center; gap: 6px; margin: 0 12px 9px; color: var(--muted); font-size: 10px; }
    .chat-thinking.visible { display: flex; }
    .chat-thinking::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); box-shadow: 9px 0 var(--muted), 18px 0 var(--muted); animation: chat-pulse 1s infinite ease-in-out; }
    @keyframes chat-pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

    /* Knowledge */
    .knowledge-stats { display: flex; gap: 21px; flex-wrap: wrap; }
    .knowledge-stat { display: flex; align-items: baseline; gap: 6px; color: var(--muted); font-size: 11px; }
    .knowledge-stat strong { color: var(--ink); font-size: 19px; }
    .knowledge-layout { display: grid; grid-template-columns: 190px minmax(0, 1fr) 300px; gap: 0; min-height: 510px; }
    .knowledge-tree, .entity-list, .entity-detail { min-width: 0; background: var(--paper); }
    .knowledge-tree { border-right: 1px solid var(--line); padding: 16px 10px; }
    .tree-search { width: 100%; height: 31px; padding: 0 8px; border: 1px solid var(--line); border-radius: 5px; font-size: 11px; }
    .tree-group { margin-top: 16px; }
    .tree-heading { display: flex; align-items: center; gap: 6px; padding: 6px; color: var(--muted); font-size: 10px; font-weight: 700; }
    .tree-heading strong { margin-left: auto; color: var(--muted-light); font-family: var(--mono); font-weight: 400; }
    .tree-node { display: flex; align-items: center; gap: 6px; padding: 7px 7px 7px 18px; color: var(--muted); border-radius: 5px; font-size: 11px; }
    .tree-node.active { color: var(--ink); background: #f1f1ee; font-weight: 600; }
    .tree-node span { margin-left: auto; color: var(--muted-light); font-size: 10px; }
    .entity-list { border-right: 1px solid var(--line); }
    .entity-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 13px; border-bottom: 1px solid var(--line); }
    .entity-toolbar strong { font-size: 12px; }
    .entity-row { display: flex; align-items: flex-start; gap: 9px; padding: 13px; border-bottom: 1px solid var(--line); }
    .entity-row.active { background: #fcfcfa; box-shadow: inset 2px 0 var(--ink); }
    .entity-dot { width: 7px; height: 7px; margin-top: 5px; border-radius: 50%; background: #65799e; flex: none; }
    .entity-copy { min-width: 0; flex: 1; }
    .entity-name { font-size: 12px; font-weight: 600; }
    .entity-path { color: var(--muted); font-size: 10px; margin-top: 3px; }
    .entity-preview { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 5px; color: var(--muted-light); font-size: 10px; }
    .entity-detail { padding: 20px; }
    .detail-type { color: var(--blue); font-size: 10px; }
    .entity-detail h3 { margin: 7px 0 3px; font-family: var(--serif); font-size: 23px; }
    .detail-path { color: var(--muted); font-size: 11px; }
    .detail-field { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .detail-field:last-child { border-bottom: 0; }
    .detail-field label { display: block; color: var(--muted-light); font-size: 10px; margin-bottom: 5px; }
    .detail-field p { margin: 0; color: var(--ink-soft); font-size: 11px; line-height: 1.7; }
    .tag-list { display: flex; gap: 5px; flex-wrap: wrap; }
    .tag { padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); font-size: 10px; }

    /* Dissect */
    .import-layout { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(260px, .8fr); gap: 14px; }
    .drop-zone { min-height: 215px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 25px; border: 1px dashed var(--line-strong); border-radius: 7px; background: var(--paper-warm); text-align: center; }
    .drop-zone .drop-icon { width: 42px; height: 42px; display: inline-flex; align-items: center; justify-content: center; border-radius: 9px; background: var(--paper); color: var(--ink); box-shadow: var(--shadow); }
    .drop-zone h3 { margin: 13px 0 4px; font-size: 15px; }
    .drop-zone p { max-width: 410px; margin: 0 0 14px; color: var(--muted); font-size: 11px; line-height: 1.65; }
    .file-queue { display: grid; gap: 8px; margin-top: 14px; }
    .file-row { display: flex; align-items: center; gap: 8px; padding: 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); }
    .file-row .file-name { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
    .file-size { color: var(--muted-light); font-size: 10px; }
    .progress { height: 5px; background: var(--canvas); border-radius: 99px; overflow: hidden; }
    .progress span { display: block; height: 100%; background: var(--ink); }
    .task-card { padding: 14px 0; border-bottom: 1px solid var(--line); }
    .task-card:last-child { border-bottom: 0; }
    .task-card-head { display: flex; justify-content: space-between; gap: 9px; }
    .task-card strong { font-size: 12px; }
    .task-card p { margin: 5px 0 10px; color: var(--muted); font-size: 10px; line-height: 1.5; }
    .task-card-foot { display: flex; justify-content: space-between; margin-top: 6px; color: var(--muted-light); font-size: 10px; }
    .style-output { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .style-output article { padding: 14px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); }
    .style-output h3 { margin: 0 0 7px; font-size: 12px; }
    .style-output p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.7; }

    /* Skills */
    .skills-layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 14px; }
    .skill-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 17px; border-bottom: 1px solid var(--line); }
    .skill-tabs { display: flex; gap: 17px; }
    .skill-tab { position: relative; padding: 4px 0 9px; border: 0; background: transparent; color: var(--muted); font-size: 12px; }
    .skill-tab.active { color: var(--ink); font-weight: 600; }
    .skill-tab.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--ink); }
    .skill-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 16px; }
    .skill-card { padding: 14px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); }
    .skill-card:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
    .skill-card-head { display: flex; align-items: flex-start; gap: 9px; }
    .skill-mark { width: 31px; height: 31px; display: inline-flex; align-items: center; justify-content: center; border-radius: 7px; background: var(--ink); color: #fff; flex: none; }
    .skill-card h3 { margin: 0; font-size: 13px; }
    .skill-card .author { margin-top: 3px; color: var(--muted); font-size: 10px; }
    .skill-card p { min-height: 37px; margin: 13px 0; color: var(--muted); font-size: 11px; line-height: 1.65; }
    .skill-foot { display: flex; align-items: center; justify-content: space-between; gap: 7px; color: var(--muted-light); font-size: 10px; }
    .private-list { display: grid; gap: 5px; }
    .private-skill { display: flex; align-items: center; gap: 8px; padding: 9px; border-radius: 5px; color: var(--muted); font-size: 11px; }
    .private-skill:hover { background: var(--canvas); color: var(--ink); }
    .private-skill .icon { color: var(--ink); }

    /* Tools and billing */
    .tool-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .tool-card { min-height: 134px; padding: 16px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); text-align: left; }
    .tool-card:hover, .tool-card.active { border-color: var(--ink); }
    .tool-card.active { box-shadow: inset 0 2px var(--ink); }
    .tool-icon { width: 29px; height: 29px; display: inline-flex; align-items: center; justify-content: center; border-radius: 7px; background: var(--canvas); color: var(--ink); }
    .tool-card h3 { margin: 12px 0 4px; font-size: 13px; }
    .tool-card p { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.55; }
    .tool-workspace { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 14px; }
    .tool-editor { min-height: 230px; width: 100%; resize: vertical; padding: 14px; border: 1px solid var(--line-strong); border-radius: 6px; color: var(--ink-soft); background: var(--paper); font-family: var(--serif); font-size: 13px; line-height: 1.8; outline: 0; }
    .tool-editor:focus { border-color: var(--ink); }
    .result-block { min-height: 230px; padding: 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper-warm); color: var(--muted); font-size: 11px; line-height: 1.7; }
    .result-block strong { color: var(--ink); }
    .billing-layout { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(260px, .8fr); gap: 14px; }
    .balance-panel { padding: 22px; background: var(--ink); color: #fff; border-radius: 8px; }
    .balance-panel .eyebrow { color: #a8a8a3; }
    .balance-value { margin: 12px 0 3px; font-size: 39px; font-weight: 700; }
    .balance-copy { color: #b8b8b2; font-size: 11px; }
    .balance-panel .button { margin-top: 20px; background: #fff; color: var(--ink); border-color: #fff; }
    .usage-chart { height: 105px; display: flex; align-items: flex-end; gap: 10px; padding-top: 10px; border-bottom: 1px solid var(--line); }
    .usage-bar { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .usage-bar span { width: 100%; max-width: 21px; height: var(--bar); border-radius: 3px 3px 0 0; background: var(--ink); }
    .usage-bar small { color: var(--muted-light); font-size: 9px; }
    .plan-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .plan-card { padding: 17px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); }
    .plan-card.featured { border-color: var(--ink); box-shadow: inset 0 2px var(--ink); }
    .plan-card h3 { margin: 0; font-size: 14px; }
    .plan-price { margin: 14px 0 12px; font-size: 23px; font-weight: 700; }
    .plan-price small { color: var(--muted); font-size: 10px; font-weight: 400; }
    .plan-card ul { min-height: 74px; margin: 0 0 14px; padding: 0; list-style: none; color: var(--muted); font-size: 10px; line-height: 2; }

    /* Docs and account */
    .docs-layout { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 14px; }
    .docs-nav { padding: 14px; }
    .docs-nav a { display: block; padding: 8px; border-radius: 5px; color: var(--muted); text-decoration: none; font-size: 11px; }
    .docs-nav a:hover, .docs-nav a.active { color: var(--ink); background: var(--canvas); }
    .article { padding: 27px clamp(20px, 5vw, 58px); }
    .article h2 { margin: 0 0 10px; font-family: var(--serif); font-size: 27px; }
    .article h3 { margin: 28px 0 8px; font-family: var(--serif); font-size: 18px; }
    .article p, .article li { color: var(--ink-soft); font-size: 13px; line-height: 1.9; }
    .article ol { padding-left: 22px; }
    .account-grid { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 14px; }
    .account-nav { padding: 13px; }
    .account-nav button { width: 100%; display: flex; align-items: center; gap: 8px; padding: 9px; border: 0; border-radius: 5px; background: transparent; color: var(--muted); text-align: left; font-size: 11px; }
    .account-nav button.active, .account-nav button:hover { color: var(--ink); background: var(--canvas); }
    .profile-form { display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 23px; align-items: start; }
    .big-avatar { width: 78px; height: 78px; display: inline-flex; align-items: center; justify-content: center; border: 1px dashed var(--line-strong); border-radius: 50%; color: var(--muted-light); }
    .form-grid { display: grid; gap: 14px; }
    .field label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 11px; }
    .field input, .field select, .field textarea { width: 100%; min-height: 35px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 5px; color: var(--ink); background: var(--paper); font-size: 12px; }
    .field textarea { min-height: 78px; padding: 9px 10px; resize: vertical; }
    .field small { display: block; margin-top: 5px; color: var(--muted-light); font-size: 10px; }

    /* User login */
    .user-login { min-height: 570px; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(330px, .95fr); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .user-login-copy { padding: 42px; display: flex; flex-direction: column; justify-content: space-between; background: var(--paper-warm); }
    .user-login-copy h2 { max-width: 420px; margin: auto 0 12px; font-family: var(--serif); font-size: clamp(28px, 4vw, 43px); line-height: 1.32; }
    .user-login-copy p { max-width: 420px; margin: 0 0 auto; color: var(--muted); font-size: 13px; line-height: 1.85; }
    .login-signal { display: flex; align-items: center; gap: 9px; margin-top: 24px; color: var(--muted); font-size: 11px; }
    .login-signal span { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
    .user-login-form { display: flex; align-items: center; justify-content: center; padding: 35px; }
    .user-login-inner { width: min(340px, 100%); }
    .user-login-inner h1 { margin: 0 0 7px; font-family: var(--serif); font-size: 26px; }
    .user-login-inner > p { margin: 0 0 25px; color: var(--muted); font-size: 12px; line-height: 1.65; }
    .login-tabs { display: flex; gap: 17px; margin-bottom: 19px; border-bottom: 1px solid var(--line); }
    .login-tab { position: relative; padding: 0 0 10px; border: 0; background: transparent; color: var(--muted); font-size: 12px; }
    .login-tab.active { color: var(--ink); font-weight: 600; }
    .login-tab.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); }
    .login-links { display: flex; justify-content: space-between; margin-top: 13px; color: var(--muted); font-size: 10px; }
    .login-links a { text-decoration: none; }
    .login-links a:hover { color: var(--ink); }

    /* Admin */
    .admin-login { min-height: 610px; display: grid; grid-template-columns: .9fr 1.1fr; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .admin-login-aside { padding: 42px; color: #fff; background: var(--ink); display: flex; flex-direction: column; justify-content: space-between; }
    .admin-login-aside .brand-mark { background: #fff; color: var(--ink); }
    .admin-login-aside h2 { max-width: 330px; margin: 80px 0 11px; font-family: var(--serif); font-size: 36px; line-height: 1.35; }
    .admin-login-aside p { max-width: 350px; margin: 0; color: #b9b9b3; font-size: 12px; line-height: 1.8; }
    .admin-login-aside footer { color: #777770; font-size: 10px; }
    .admin-login-form { display: flex; align-items: center; justify-content: center; padding: 35px; }
    .admin-login-form-inner { width: min(360px, 100%); }
    .admin-login-form h1 { margin: 0 0 7px; font-family: var(--serif); font-size: 25px; }
    .admin-login-form > div > p { margin: 0 0 26px; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .admin-lock { width: 39px; height: 39px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 19px; border-radius: 9px; background: var(--canvas); }
    .admin-form-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 13px; color: var(--muted); font-size: 10px; }
    .check { display: inline-flex; align-items: center; gap: 5px; }
    .admin-dashboard { display: grid; grid-template-columns: 205px minmax(0, 1fr); min-height: 610px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--canvas); }
    .admin-nav { background: var(--ink); color: #fff; padding: 17px 12px; }
    .admin-nav-brand { display: flex; align-items: center; gap: 8px; padding: 0 7px 21px; border-bottom: 1px solid #333; }
    .admin-nav-brand .brand-mark { width: 26px; height: 26px; background: #fff; color: var(--ink); font-size: 14px; }
    .admin-nav-brand strong { font-family: var(--serif); font-size: 13px; }
    .admin-nav-group { margin-top: 20px; }
    .admin-nav-label { padding: 0 8px 7px; color: #76766f; font-size: 9px; letter-spacing: .12em; }
    .admin-nav button { width: 100%; display: flex; align-items: center; gap: 8px; padding: 9px 8px; border: 0; border-radius: 5px; background: transparent; color: #999992; text-align: left; font-size: 11px; }
    .admin-nav button.active, .admin-nav button:hover { color: #fff; background: #272725; }
    .admin-main { min-width: 0; padding: 24px clamp(18px, 3vw, 33px); overflow: auto; }
    .admin-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
    .admin-top h2 { margin: 5px 0 0; font-family: var(--serif); font-size: 25px; }
    .admin-kpi { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; }
    .admin-kpi .metric { background: var(--paper); }
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th { padding: 10px 8px; color: var(--muted-light); font-size: 10px; font-weight: 600; text-align: left; border-bottom: 1px solid var(--line); }
    .data-table td { padding: 12px 8px; color: var(--muted); font-size: 11px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    .data-table tr:last-child td { border-bottom: 0; }
    .data-table td strong { color: var(--ink); font-weight: 600; }
    .table-input { width: 68px; height: 28px; padding: 0 6px; border: 1px solid var(--line-strong); border-radius: 4px; font-size: 11px; }
    .admin-panel-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(250px, .75fr); gap: 12px; margin-top: 12px; }
    .admin-detail-panel { margin-top: 12px; }
    .admin-detail-panel .data-table { min-width: 580px; }
    .admin-detail-copy { color: var(--muted); font-size: 12px; line-height: 1.7; }

    /* Modal */
    .modal-backdrop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 20px; z-index: 80; background: rgba(10,10,10,.32); }
    .modal-backdrop.open { display: flex; }
    .modal { width: min(540px, 100%); max-height: 90vh; overflow: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 9px; box-shadow: var(--shadow); }
    .modal-head, .modal-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 15px 18px; border-bottom: 1px solid var(--line); }
    .modal-head h2 { margin: 0; font-family: var(--serif); font-size: 18px; }
    .modal-body { padding: 18px; }
    .modal-foot { justify-content: flex-end; border-top: 1px solid var(--line); border-bottom: 0; }

    @media (max-width: 1120px) {
      .site-header { padding: 0 18px; gap: 15px; }
      .brand { min-width: auto; }
      .brand-label { display: none; }
      .preview-frame { grid-template-columns: 215px minmax(0, 1fr); }
      .editor-preview { grid-template-columns: 160px minmax(0, 1fr) 275px; }
      .knowledge-layout { grid-template-columns: 170px minmax(0, 1fr) 260px; }
    }
    @media (max-width: 820px) {
      body { overflow-x: hidden; }
      .site-header { height: 58px; }
      .top-crumb { display: none; }
      .mobile-menu { display: inline-flex; }
      .preview-frame { display: block; min-height: calc(100vh - 58px); }
      .app-sidebar { position: fixed; top: 58px; bottom: 0; left: 0; z-index: 50; width: min(290px, 84vw); transform: translateX(-105%); box-shadow: 8px 0 30px rgba(0,0,0,.12); transition: transform .22s ease; }
      .preview-frame.sidebar-open .app-sidebar { transform: translateX(0); }
      .page-scroll { height: calc(100vh - 58px); padding: 24px 14px 55px; }
      .page-header { align-items: flex-start; flex-direction: column; margin-bottom: 21px; }
      .header-tools { width: 100%; justify-content: flex-start; }
      .overview-hero, .library-layout, .import-layout, .skills-layout, .billing-layout, .tool-workspace, .docs-layout, .account-grid { grid-template-columns: 1fr; }
      .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .editor-preview { height: 720px; grid-template-columns: 1fr; position: relative; }
      .page-shell.editor-page { width: 100%; }
      .editor-rail-toggle { left: 0; top: 93px; }
      .editor-nav { position: absolute; top: 0; bottom: 0; left: 0; z-index: 7; width: min(290px, 84vw); transform: translateX(-105%); box-shadow: 8px 0 30px rgba(0,0,0,.14); transition: transform .22s ease; }
      .editor-preview.nav-open .editor-nav { transform: translateX(0); }
      .editor-nav-scrim { position: absolute; inset: 0; z-index: 6; display: none; background: rgba(0,0,0,.23); }
      .editor-preview.nav-open .editor-nav-scrim { display: block; }
      .editor-mobile-back { display: inline-flex; }
      .editor-ai { position: absolute; top: 0; right: 0; bottom: 0; z-index: 4; width: min(315px, 88vw); transform: translateX(105%); transition: transform .22s ease; box-shadow: -8px 0 28px rgba(0,0,0,.14); }
      .editor-preview.ai-open .editor-ai { transform: translateX(0); }
      .editor-main { height: 100%; }
      .knowledge-layout { grid-template-columns: 1fr; }
      .knowledge-tree { display: none; }
      .entity-list { border-right: 0; }
      .entity-detail { border-top: 1px solid var(--line); }
      .style-output, .plan-grid { grid-template-columns: 1fr; }
      .admin-login { grid-template-columns: 1fr; }
      .admin-login-aside { min-height: 230px; padding: 25px; }
      .admin-login-aside h2 { margin: 32px 0 8px; font-size: 27px; }
      .admin-login-form { padding: 28px 20px; }
      .admin-dashboard { grid-template-columns: 1fr; }

        });
      }

      if (currentPage === 'knowledge') {
        const detail = document.getElementById('entityDetail');
        const entityData = {
          '青云城': { type: '地点 · 已引用 4 次', path: '中州 / 北境 / 城池', intro: '玄天宗山门所在，叶家旧宅位于城南。城内势力交错，是第一卷主要活动区域。', tags: ['玄天宗', '叶家', '叶灵儿'], chapters: '第 1 章、第 2 章、第 3 章、第 7 章' },
          '玄天宗': { type: '势力 · 已引用 7 次', path: '势力 / 中州 / 宗门', intro: '向叶辰发出入宗邀请的宗门，内部存在轮回殿相关线索。', tags: ['青云城', '叶辰', '轮回殿'], chapters: '第 2 章、第 3 章、第 6 章' },
          '叶灵儿': { type: '人物 · 已引用 5 次', path: '人物 / 叶家 / 青云城', intro: '叶辰的妹妹，知道部分邀请内情，当前选择保持沉默。', tags: ['叶辰', '叶家', '玄天宗'], chapters: '第 1 章、第 3 章、第 7 章' },
          '轮回神玉': { type: '物品 · 已引用 6 次', path: '物品 / 灵器 / 核心道具', intro: '随叶辰重生的核心物品，第二道印记尚未完全显现。', tags: ['叶辰', '轮回殿'], chapters: '第 1 章、第 2 章、第 8 章' }
        };
        stage.querySelectorAll('.entity-row').forEach((row) => row.addEventListener('click', () => {
          stage.querySelectorAll('.entity-row').forEach((item) => item.classList.remove('active'));
          row.classList.add('active');
          const data = entityData[row.dataset.entity];
          if (data && detail) {
            detail.querySelector('.detail-type').textContent = data.type;
            detail.querySelector('h3').textContent = row.dataset.entity;
            detail.querySelector('.detail-path').textContent = data.path;
            const paragraphs = detail.querySelectorAll('.detail-field p');
            paragraphs[0].textContent = data.intro;
            paragraphs[1].textContent = data.chapters;
            detail.querySelector('.tag-list').innerHTML = data.tags.map((tag) => `<span class="tag">${tag}</span>`).join('');
          }
          showToast(`已选中设定：${row.dataset.entity}`);
        }));
      }

      if (currentPage === 'tools') {
        stage.querySelectorAll('.tool-card').forEach((card) => card.addEventListener('click', () => { stage.querySelectorAll('.tool-card').forEach((item) => item.classList.remove('active')); card.classList.add('active'); document.getElementById('toolTitle').textContent = card.dataset.tool; }));
        document.getElementById('runTool')?.addEventListener('click', (event) => {
          const button = event.currentTarget;
          const result = stage.querySelector('.result-block');
          button.disabled = true;
          button.textContent = '分析中…';
          result.innerHTML = '<strong>正在分析</strong><br>正在检查句式重复、情绪表达和节奏密度…';
          window.setTimeout(() => { result.innerHTML = '<strong>分析完成</strong><br>发现 3 处模板化表达，已生成修改建议。结果会先进入对话区供你确认。'; button.disabled = false; button.textContent = '再次分析'; showToast('分析完成，实际消耗 18 积分'); }, 520);
        });
      }

      if (currentPage === 'admin') {
        const adminButtons = stage.querySelectorAll('.admin-nav button');
        adminButtons.forEach((button) => button.addEventListener('click', () => {
          adminButtons.forEach((item) => item.classList.remove('active'));
          button.classList.add('active');
          activateAdminSection(button.textContent.trim());
        }));
        stage.querySelectorAll('[data-admin-save]').forEach((node) => node.addEventListener('click', () => showToast('修改已保存到本地预览。')));
      }

      if (currentPage === 'docs') stage.querySelectorAll('.docs-nav a').forEach((link) => link.addEventListener('click', (event) => { event.preventDefault(); stage.querySelectorAll('.docs-nav a').forEach((item) => item.classList.remove('active')); link.classList.add('active'); showToast(`教程章节：${link.textContent.trim()}`); }));
    }
    function openModal() { document.getElementById('modalBackdrop').classList.add('open'); document.getElementById('novelTitle').focus(); }
    function closeModal() { document.getElementById('modalBackdrop').classList.remove('open'); }
    document.addEventListener('click', (event) => { const pageButton = event.target.closest('[data-page]'); if (pageButton && !stage.contains(pageButton)) { event.preventDefault(); renderPage(pageButton.dataset.page); } const toastButton = event.target.closest('[data-toast]'); if (toastButton && !stage.contains(toastButton)) showToast(toastButton.dataset.toast); });
    document.getElementById('mobileMenu').addEventListener('click', () => frame.classList.toggle('sidebar-open'));
    document.getElementById('scrim').addEventListener('click', closeSidebar);
    document.getElementById('closeModal').addEventListener('click', closeModal);
    document.getElementById('cancelModal').addEventListener('click', closeModal);
    document.getElementById('confirmModal').addEventListener('click', () => {
      const title = document.getElementById('novelTitle').value.trim();
      if (!title) { showToast('请先填写小说标题'); document.getElementById('novelTitle').focus(); return; }
      previewState.novel = { title, intro: document.getElementById('novelIntro').value.trim(), type: document.getElementById('novelType').value };
      previewState.editorBody = '';
      previewState.editorChat = null;
      closeModal();
      renderPage('editor');
      showToast(`已创建《${title}》，进入编辑器。`);
    });
    document.getElementById('modalBackdrop').addEventListener('click', (event) => { if (event.target.id === 'modalBackdrop') closeModal(); });
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && document.getElementById('modalBackdrop').classList.contains('open')) closeModal(); });
    window.addEventListener('popstate', () => { const page = window.location.hash.slice(1); renderPage(renderers[page] ? page : 'overview', { fromHistory: true }); });
    window.addEventListener('hashchange', () => { const page = window.location.hash.slice(1); if (page !== currentPage) renderPage(renderers[page] ? page : 'overview', { fromHistory: true }); });
    mountIcons();
    const initialPage = window.location.hash.slice(1);
    renderPage(renderers[initialPage] ? initialPage : 'overview', { replace: true });
  </script>
</body>
</html>
