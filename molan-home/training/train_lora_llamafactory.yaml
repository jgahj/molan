### LLaMA-Factory SFT Configuration for Molan De-AI Novel Humanizer
### Model: Qwen2.5-7B-Instruct
### Dataset: molan_de_ai_alpaca (from 1,279 human novels)

### Model arguments
model_name_or_path: Qwen/Qwen2.5-7B-Instruct
trust_remote_code: true

### Method arguments
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05

### Dataset arguments
dataset: molan_de_ai_alpaca
dataset_dir: ./data
template: qwen
cutoff_len: 2048
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 4

### Output arguments
output_dir: ./output/qwen2.5-7b-molan-lora
logging_steps: 10
save_steps: 200
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true

### Training hyperparameters
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 0.0002
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
flash_attn: fa2

### Evaluation
val_size: 0.05
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 200
