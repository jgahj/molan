[Service]
Environment=MOLAN_DB_BACKEND=postgres
Environment=MOLAN_PG_ENABLED=1
Environment=MOLAN_PG_HOST=127.0.0.1
Environment=MOLAN_PG_PORT=5432
Environment=MOLAN_PG_DATABASE=molan
Environment=MOLAN_PG_USER=novel_runtime
Environment=MOLAN_PG_PASSWORD_FILE=/etc/molan/pg-runtime.pass
Environment=MOLAN_PG_RUNTIME_ROLE=novel_app
Environment=MOLAN_PG_WORKER_ROLE=novel_worker
Environment=MOLAN_PG_POOL_MAX=4
Environment=MOLAN_PG_CONNECT_TIMEOUT_MS=5000
Environment=MOLAN_PG_IDLE_TIMEOUT_MS=30000
