<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>马良写作 Clone · AI 小说创作平台</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">
      <span class="logo">🖌️</span>
      <span class="brand-name">马良写作</span>
      <span class="brand-sub">AI 小说创作平台</span>
    </div>
    <div class="top-actions">
      <select id="modelSelect" class="model-select" title="选择模型">
        <option value="deepseek-chat">DeepSeek V3 · deepseek-chat</option>
        <option value="deepseek-reasoner">DeepSeek R1 · deepseek-reasoner</option>
      </select>
      <span id="wordCount" class="word-count">0 字</span>
      <button id="newBookBtn" class="btn">新建小说</button>
      <button id="newChapterBtn" class="btn">新建章节</button>
      <button id="saveBtn" class="btn btn-primary">保存</button>
    </div>
  </header>

  <div class="layout">
    <!-- 左侧：书架 + 章节树 -->
    <aside class="sidebar-left">
      <div class="panel">
        <div class="panel-title">我的小说</div>
        <ul id="bookList" class="book-list"></ul>
      </div>
      <div class="panel grow">
        <div class="panel-title">章节大纲</div>
        <ul id="chapterList" class="chapter-list"></ul>
      </div>
    </aside>

    <!-- 中间：编辑器 -->
    <main class="editor-area">
      <input id="chapterTitle" class="chapter-title" placeholder="章节标题，如：第一章 觉醒" />
      <div class="format-toolbar">
        <button data-cmd="bold" title="加粗"><b>B</b></button>
        <button data-cmd="italic" title="斜体"><i>I</i></button>
        <button data-cmd="underline" title="下划线"><u>U</u></button>
        <button data-cmd="insertUnorderedList" title="列表">≡</button>
        <button data-cmd="formatBlock" data-val="h2" title="标题">H</button>
        <button id="clearFormat" title="清除格式">⌫</button>
      </div>
      <div id="editor" class="editor" contenteditable="true" spellcheck="false"></div>
    </main>

    <!-- 右侧：AI 助手 -->
    <aside class="sidebar-right">
      <div class="ai-header">
        <span>AI 助手</span>
        <button id="stopBtn" class="btn btn-stop" disabled>■ 停止</button>
      </div>
      <div class="agent-grid">
        <button class="agent-btn" data-action="continue">⏩ 续写</button>
        <button class="agent-btn" data-action="polish">✨ 润色</button>
        <button class="agent-btn" data-action="rewrite">🔄 改写</button>
        <button class="agent-btn" data-action="generate">📝 生成章节</button>
        <button class="agent-btn" data-action="outline">🗺️ 写大纲</button>
        <button class="agent-btn" data-action="setting">🌍 写设定</button>
      </div>

      <div id="chatLog" class="chat-log"></div>

      <div id="resultBox" class="result-box" hidden>
        <div class="result-head">
          <span id="resultTitle">AI 结果</span>
          <div>
            <button id="applyResult" class="btn btn-small">应用到正文</button>
            <button id="copyResult" class="btn btn-small">复制</button>
          </div>
        </div>
        <div id="resultText" class="result-text"></div>
      </div>

      <div class="chat-input-row">
        <textarea id="chatInput" placeholder="和 AI 对话，或描述写作需求…（Enter 发送 / Shift+Enter 换行）"></textarea>
        <button id="sendBtn" class="btn btn-primary">发送</button>
      </div>
    </aside>
  </div>

  <!-- 大纲 / 设定 结果弹窗 -->
  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <span id="modalTitle">结果</span>
        <button id="modalClose" class="btn btn-small">关闭</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
      <div class="modal-foot">
        <button id="modalCopy" class="btn btn-small">复制</button>
        <button id="modalSave" class="btn btn-primary btn-small">保存到本书</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
